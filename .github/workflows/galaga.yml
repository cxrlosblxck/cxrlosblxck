name: Generate Galaga Shooter

on:
  schedule:
    - cron: "0 0 * * *"   # cada medianoche UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar Galaga SVG
        run: node galaga.js

      - name: Publicar en rama output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "🎮 Actualizar Galaga SVG [skip ci]"
