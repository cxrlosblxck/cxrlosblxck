name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Todos los días a medianoche UTC
  workflow_dispatch:

permissions:
  contents: write  # Permite escribir en la rama output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generar Snake
        uses: Platane/snk@v3
        with:
          github_user_name: cxrlosblxck
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publicar en rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
